name: run
on:
  workflow_dispatch:
    inputs:
      n: { description: "connections per runner", required: true, default: "400" }
      dur: { description: "seconds", required: true, default: "120" }
      shards: { description: "parallel runners", required: true, default: "1" }
      tag: { description: "label", required: false, default: "run" }
      script: { description: "script", required: false, default: "worker.mjs" }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: run
        env:
          N: ${{ inputs.n }}
          DUR: ${{ inputs.dur }}
          TAG: ${{ inputs.tag }}-${{ matrix.shard }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          SCRIPT: ${{ inputs.script }}
        run: |
          if [ "$SHARD" -gt "$SHARDS" ]; then echo "skip"; exit 0; fi
          echo "egress IP: $(curl -s https://api.ipify.org)"
          node ${SCRIPT:-worker.mjs}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ inputs.tag }}-${{ matrix.shard }}
          path: log-*.txt
          if-no-files-found: ignore
